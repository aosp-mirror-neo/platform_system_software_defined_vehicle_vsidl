syntax = "proto3";

package sdv.golden.size_limit;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "sdv/vsidl/v1/annotations.proto";

message MessageWithSizeLimit {
  option (sdv.vsidl.v1.publication) = {
    message_count: 8
    model: SINGLE_PUB
  };

  repeated int32 repeated_ints = 1 [(sdv.vsidl.v1.repeated_field_max_count) = 5];

  string string = 2 [(sdv.vsidl.v1.variable_type_max_size) = 100];

  optional string optional_string = 3 [(sdv.vsidl.v1.variable_type_max_size) = 100];

  bytes bytes = 4 [(sdv.vsidl.v1.variable_type_max_size) = 100];

  optional bytes optional_bytes = 5 [(sdv.vsidl.v1.variable_type_max_size) = 100];

  repeated string repeated_strings = 6
      [(sdv.vsidl.v1.repeated_field_max_count) = 5, (sdv.vsidl.v1.variable_type_max_size) = 100];

  google.protobuf.Timestamp time = 7;

  google.protobuf.Any any = 10 [(sdv.vsidl.v1.variable_type_max_size) = 200];

  optional google.protobuf.Timestamp optional_time = 8 [(sdv.vsidl.v1.variable_type_max_size) = 20];

  repeated google.protobuf.Timestamp repeated_times = 9
      [(sdv.vsidl.v1.repeated_field_max_count) = 5, (sdv.vsidl.v1.variable_type_max_size) = 20];
}
