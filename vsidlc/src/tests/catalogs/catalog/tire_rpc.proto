syntax = "proto3";

package sdv.golden.rpc;

import "google/protobuf/empty.proto";

enum TireLocation {
  UNKNOWN = 0;
  FRONT_LEFT = 1;
  FRONT_RIGHT = 2;
  REAR_LEFT = 3;
  REAR_RIGHT = 4;
}

message GetTireStatusRequest {
  TireLocation tire = 1;
}

message GetTirePressureResponse {
  TireLocation tire = 1;
  float pressure = 2;
}

message GetTIRETemperatureResponse {
  TireLocation tire = 1;
  float temperature = 2;
}

service TireStatus {
  rpc GetTirePressure(GetTireStatusRequest) returns (GetTirePressureResponse) {}
  rpc GetTireTemperature(google.protobuf.Empty) returns (GetTIRETemperatureResponse) {}
  rpc GetTirePressureClientStream(stream GetTireStatusRequest) returns (GetTirePressureResponse) {}
  rpc GetTireTemperatureServerStream(google.protobuf.Empty)
      returns (stream GetTIRETemperatureResponse) {}
}

service TireStatusInDisabledBundle {
  rpc GetTirePressure(GetTireStatusRequest) returns (GetTirePressureResponse) {}
  rpc GetTireTemperature(google.protobuf.Empty) returns (GetTIRETemperatureResponse) {}
}
