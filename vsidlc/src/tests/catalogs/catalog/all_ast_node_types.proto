syntax = "proto3";

package sdv.golden;

import "sdv/vsidl/v1/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/descriptor.proto";

enum TestVariants {
  ONE = 0;
  TWO = 1;
}

enum PressureVariants {
  PRESSURE_ONE = 0;
  PRESSURE_TWO = 1;
}

enum TemperatureVariants {
  TEMPERATURE_ONE = 0;
  TEMPERATURE_TWO = 1;
}

enum BatteryLevelVariants {
  option allow_alias = true;
  BATTERY_MAIN = 0;
  BATTERY_PRIMARY = 0;
}

extend google.protobuf.FileOptions {
  optional string my_file_option = 60000;
}
extend google.protobuf.MessageOptions {
  optional int32 my_message_option = 60001;
}
extend google.protobuf.FieldOptions {
  optional float my_field_option = 60002;
}
extend google.protobuf.OneofOptions {
  optional int64 my_oneof_option = 60003;
}
extend google.protobuf.EnumOptions {
  optional bool my_enum_option = 60004;
}
extend google.protobuf.EnumValueOptions {
  optional uint32 my_enum_value_option = 60005;
}
extend google.protobuf.ServiceOptions {
  optional bool my_service_option = 60006;
}
extend google.protobuf.MethodOptions {
  optional bool my_method_option = 60007;
}

option (my_file_option) = "Hello world!";

enum BatteryVariants {
  option allow_alias = true;
  option (my_enum_option) = true;
  MAIN = 0;
  PRIMARY = 0 [(my_enum_value_option) = 321];
  // todo: reserved 2, 3 to 5, 6 to max;
}

message BatteryLevel {
  option (my_message_option) = 1234;

  option (sdv.vsidl.v1.publication) = {
    instances_enum : "sdv.golden.BatteryLevelVariants"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 pressure = 1 [deprecated = true];
}

message Temperature {
  option (sdv.vsidl.v1.publication) = {
    instances_enum : "TemperatureVariants"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 temperature = 1 [(my_field_option) = 4.5];
  reserved 2, 15, 9 to 11;
}

message Speed {
  option (sdv.vsidl.v1.publication) = {
    message_count: 8
    model: MULTI_PUB
  };

  oneof speed {
    option (my_oneof_option) = 42;
    float kmh = 1;
    float mph = 2;
  }
}

service DummyRpc {
  option (my_service_option) = true;
  rpc my_rpc(DummyRequest) returns (DummyResponse) {
    option (my_method_option) = true;
  }
  rpc method_with_well_known_types(google.protobuf.Any) returns (google.protobuf.Empty) {}
}

message DummyRequest {}
message DummyResponse {}

message Pressure {
  option (sdv.vsidl.v1.publication) = {
    instances_enum : "sdv.golden.PressureVariants"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 pressure = 1;
}