syntax = "proto3";

import "sdv/vsidl/v1/annotations.proto";

package sdv.vsidl.common.test;

message WithAnnotations {
  repeated int32 numbers = 1 [ (.sdv.vsidl.v1.repeated_field_max_count) = 319 ];
  repeated int32 numbers_wrong_annotation = 2
      [ (.sdv.vsidl.v1.variable_type_max_size) = 95 ];
  int32 single_num = 3 [
    (.sdv.vsidl.v1.repeated_field_max_count) = 548,
    (.sdv.vsidl.v1.variable_type_max_size) = 23
  ];
  bytes data = 4 [ (.sdv.vsidl.v1.variable_type_max_size) = 952 ];
  bytes data_wrong_annotation = 5
      [ (.sdv.vsidl.v1.repeated_field_max_count) = 93 ];
}

message WithoutAnnotations {
  repeated int32 numbers = 1;
  int32 single_num = 2;
  bytes data = 3;
}
