syntax = "proto3";
package sdv.proto.test.message.difftarget;
import "sdv/vsidl/v1/annotations.proto";

// for annotation error test
message DiffTargetNoAnnotationMessage {
  repeated int32 differenttargetmessage = 1;
}

// for annotation ok test
message DiffTargetWithAnnotationMessage {
  repeated int32 differenttarget_annotation_message = 1
      [ (.sdv.vsidl.v1.repeated_field_max_count) = 5 ];
}

// for loop error test
message DiffTargetLoopMessage { One one = 1; }

// for loop error test
message One { Two two = 2; }

// for loop error test
message Two { Three three = 1; }

// for loop error test
message Three { DiffTargetLoopMessage mssg = 1; }