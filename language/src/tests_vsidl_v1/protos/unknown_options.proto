syntax = "proto3";

package sdv.test;

import "sdv/vsidl/v1/annotations.proto";
import "sdv/diagnostics/v1/diagnostics.proto";
import "google/protobuf/descriptor.proto";

message Placeholder { uint32 number = 1; }

extend google.protobuf.MessageOptions {
  // Placeholder that shall be removed by strip
  Placeholder placeholder = 69999;
}

extend google.protobuf.FieldOptions {
  // Placeholder that shall be removed by strip options visitor
  optional int32 repeated_field_max_count = 60050;
}

extend google.protobuf.EnumOptions { optional bool my_enum_option = 67890; }

enum BatteryChannels {
  option (my_enum_option) = true;
  option (sdv.diagnostics.v1.enum_byte_size) = THREE;

  MAIN = 0;
}

message BatteryLevel {
  // This is a known option that should stay after stripping unknown options
  option (sdv.vsidl.v1.publication) = {
    channels_enum : "sdv.test.BatteryChannels"
    message_count : 8
    model : SINGLE_PUB
  };

  option (sdv.test.placeholder) = {
    number : 5
  };

  repeated uint32 level1 = 1
      [ (.sdv.vsidl.v1.repeated_field_max_count) = 10000 ];
  repeated uint32 level2 = 2 [ (sdv.test.repeated_field_max_count) = 7 ];
}
