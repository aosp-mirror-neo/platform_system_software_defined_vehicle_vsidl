syntax = "proto3";
package sdv.proto.test.message.annotation;
import "sdv/vsidl/v1/annotations.proto";

// for annotation error test
message SameTargetNoAnnotationMessage {
  repeated int32 sametargetsubmessage = 1;
}

// for annotation ok test
message SameTargetWithAnnotationMessage {
  repeated int32 sametarget_annotation_submessag = 1
      [ (.sdv.vsidl.v1.repeated_field_max_count) = 5 ];
}

// for loop error test
message SameTargetLoopMessage { First first = 1; }

// for loop error test
message First { Second second = 1; }

// for loop error test
message Second { SameTargetLoopMessage mssg = 1; }