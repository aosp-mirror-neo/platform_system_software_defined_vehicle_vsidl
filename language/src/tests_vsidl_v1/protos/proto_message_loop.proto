syntax = "proto3";
package sdv.proto.test.message.annotation;
import "sdv/vsidl/v1/annotations.proto";
import "proto_message_submessage_same_target.proto";
import "proto_message_submessage_diff_target.proto";

// self reference
message LoopSinglePubMessageA {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : SINGLE_PUB
  };

  LoopSinglePubMessageA msg = 1;
}

// loop with nested message
message LoopSinglePubMessageB {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : SINGLE_PUB
  };

  message Nested { LoopSinglePubMessageB msg = 1; }
  Nested nested_msg = 1;
}

// loop with sub message in same file
message LoopSinglePubMessageC {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : SINGLE_PUB
  };
  LoopSubMessage msg = 1;
}

message LoopSubMessage { LoopSinglePubMessageC msg = 1; }

// loop with sub message in same target (3 messages loop)
message LoopMultiPubMessageA {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : MULTI_PUB
  };

  SameTargetLoopMessage msg = 1;
}

// loop with sub message in different target (4 messages loop)
message LoopMultiPubMessageB {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : MULTI_PUB
  };

  .sdv.proto.test.message.difftarget.DiffTargetLoopMessage msg = 1;
}
