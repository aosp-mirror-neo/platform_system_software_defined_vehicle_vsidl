syntax = "proto3";

package sdv.test;

import "sdv/vsidl/v1/annotations.proto";

enum DummyRpcChannels {
  ONE = 0;
  TWO = 1;
}

/// A message that has a name clash with the RPC service in dummy_rpc.proto
message DummyRpc {
  option (sdv.vsidl.v1.publication) = {
    channels_enum : "sdv.test.DummyRpcChannels"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 placeholder = 1;
}