syntax = "proto3";

package sdv.vsidl.test;

import "google/protobuf/empty.proto";
import "sdv/vsidl/v1/annotations.proto";

enum TireLocation {
  FRONT_LEFT = 0;
  FRONT_RIGHT = 1;
  REAR_LEFT = 2;
  REAR_RIGHT = 3;
}

message GetTireStatusRequest {
  TireLocation tire = 1;
  bool error = 2;
}

message GetTirePressureResponse {
  TireLocation tire = 1;
  uint32 pressure = 2;
  string caller = 3;
}

// It's an RPC service definition (not SDV service bundle channel). Service
// bundle channels are defined in *.vsidl files.
service TireStatus {
  rpc GetTirePressure(GetTireStatusRequest) returns (GetTirePressureResponse) {}
}

message TirePressure {
  option (.sdv.vsidl.v1.publication) = {
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 pressure = 1;
}