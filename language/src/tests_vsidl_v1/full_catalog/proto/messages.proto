syntax = "proto3";

package sdv.test;

import "sdv/vsidl/v1/annotations.proto";

enum TestChannels {
  LEFT = 0;
  RIGHT = 1;
}

message Pressure {
  option (sdv.vsidl.v1.publication) = {
    channels_enum : "sdv.test.TestChannels"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 pressure = 1;
}

message Temperature {
  option (sdv.vsidl.v1.publication) = {
    channels_enum : "TestChannels"
    message_count : 8
    model : SINGLE_PUB
  };

  uint32 temperature = 1;
}

message Speed {
  option (sdv.vsidl.v1.publication) = {
    message_count : 8
    model : MULTI_PUB
  };
  float speed = 1;
}
