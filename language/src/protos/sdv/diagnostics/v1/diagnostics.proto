// Defines field options for Diagnostics serialization.

// WARNING: This is an experimental API and not expected to be stable or final.
//          Content of the file might drastically change with further
//          development iterations.

syntax = "proto3";

import "google/protobuf/descriptor.proto";

package sdv.diagnostics.v1;

// Currently this option is only supported by libsdv_uds_serde.
// Should be moved to vsidl.proto, once supported by VSIDL toolchain.
enum ByteSize {
  // [default] keeps the proto field size unchanged.
  UNCHANGED = 0;
  // changes proto field size to 1 bytes.
  ONE = 1;
  // changes proto field size to 2 bytes.
  TWO = 2;
  // changes proto field size to 3 bytes.
  THREE = 3;
}

message FixedPointEncoding {
  double scale = 1;
  double offset = 2;
}

extend google.protobuf.FieldOptions {
  // Specifies byte size of the primitive field.
  // Applicable to `int32`, `uint32` and `float` (if fixed_point_encoding is
  // also specified) fields. Fields annotated with this option are required to
  // fit into corresponding byte size type and will be serialized as such:
  //
  //         |  ONE  |  TWO  |  THREE  | UNCHANGED |
  // ________|_______|_______|_________|___________|
  // uint32  |   u8  |  u16  | [u8; 3] |    u32    |
  // ________|_______|_______|_________|___________|
  // int32   |   i8  |  i16  | [u8; 3] |    i32    |
  // ________|_______|_______|_________|___________|
  // float   |   i8  |  i16  | [u8; 3] |    i32    |
  // ________|_______|_______|_________|___________|
  ByteSize primitive_byte_size = 50200;

  // Specifies fixed point encoding parameters for floating point fields.
  // Applicable to `float` and `double` fields. Fields annotated with this
  // option will be serialized as such:
  // _________________________________________________________________
  //               |                                                  |
  // float as i32  | ( ( (float as f64) - offset ) / scale ) as i32   |
  // ______________|__________________________________________________|
  //               |                                                  |
  // double as i64 |     ( ( double - offset ) / scale ) as i64       |
  // ______________|__________________________________________________|
  //
  // During deserialization, the reverse transformation is applied:
  // ___________________________________________________________________
  //                 |                                                  |
  // float from i32  |   ( ( i32 as f64 ) * scale + offset ) as float   |
  // ________________|__________________________________________________|
  //                 |                                                  |
  // double from i64 |   ( ( i64 as f64 ) * scale + offset ) as double  |
  // ________________|__________________________________________________|
  FixedPointEncoding fixed_point_encoding = 50201;

  // Defines if the field should be skipped during diag
  // serialization/deserialization.
  bool skip_for_diag = 50202;
}

extend google.protobuf.EnumOptions {
  // Specifies byte size of the enum.
  // Applicable to enum *type definition*. Enums annotated with this option will
  // be serialized as such:
  //         |  ONE  |  TWO  |  THREE  |  UNCHANGED  |
  // ________|_______|_______|_________|_____________|
  // enum    |   u8  |  u16  | [u8; 3] |     i32     |
  // ________|_______|_______|_________|_____________|
  //
  // Enums annotated with ONE / TWO / THREE must only contain positive values.
  ByteSize enum_byte_size = 50200;
}
