syntax = "proto3";

package com.sdv.google.sample.vsidl_provider;

import "sdv/vsidl/v1/annotations.proto";
import "google/protobuf/empty.proto";
import "nested.proto";

enum LocationAndSampleApexType {
  FRONT_LEFT_PER_BUNDLE = 0;
  FRONT_RIGHT_PER_BUNDLE = 1;
  FRONT_LEFT_SHARED = 3;
  FRONT_RIGHT_SHARED = 4;
}

enum SampleApexType {
  PER_BUNDLE = 0;
  SHARED = 1;
}

message TirePressure {
  option (.sdv.vsidl.v1.publication) = {
    instances_enum: "LocationAndSampleApexType"
    message_count: 8
    model: SINGLE_PUB
  };

  uint32 pressure = 1;
  NestedMessage nested = 2;
}

message TirePressureRange {
  option (.sdv.vsidl.v1.publication) = {
    instances_enum: "SampleApexType"
    model: SINGLE_PUB
    message_count: 8
  };

  enum Range {
    OK = 0;
    LOW = 1;
    HIGH = 2;
  }

  Range range = 1;
}